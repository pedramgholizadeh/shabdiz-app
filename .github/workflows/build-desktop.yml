name: Build Desktop Apps

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  API_BASE_URL: "https://apps.webiro.ir/shabdiz/api"

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS arm64
            arch: arm64
            artifact: shabdiz-macos-arm64
          - os: macos-15-intel
            label: macOS x64
            arch: x64
            artifact: shabdiz-macos-x64
          - os: ubuntu-24.04
            label: Linux x64
            arch: x64
            artifact: shabdiz-linux-x64
          - os: ubuntu-24.04-arm
            label: Linux arm64
            arch: arm64
            artifact: shabdiz-linux-arm64
          - os: windows-latest
            label: Windows x64
            arch: x64
            artifact: shabdiz-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 -o DPkg::Lock::Timeout=120)
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrade 2>/dev/null || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true

          MIRROR=""
          if [ "$ARCH" = "arm64" ]; then
            CANDIDATES=(https://ports.ubuntu.com/ubuntu-ports https://mirrors.edge.kernel.org/ubuntu-ports https://mirrors.aliyun.com/ubuntu-ports https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports)
          else
            CANDIDATES=(https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu https://mirrors.aliyun.com/ubuntu https://mirror.arvancloud.ir/ubuntu https://mirrors.tuna.tsinghua.edu.cn/ubuntu)
          fi
          for M in "${CANDIDATES[@]}"; do
            H="${M#https://}"; H="${H%%/*}"
            if getent hosts "$H" >/dev/null 2>&1; then
              if curl -sSfI --max-time 20 "$M/dists/noble/InRelease" >/dev/null 2>&1; then
                echo "using mirror: $M"; MIRROR="$M"; break
              fi
              echo "resolvable but unreachable: $M"
            else
              echo "dns failure: $H"
            fi
          done
          if [ -z "$MIRROR" ]; then echo "no reachable Ubuntu mirror"; exit 1; fi
          echo "$MIRROR" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null 2>&1 || true
          sudo sed -i -E "s|^URIs:.*|URIs: $MIRROR|" /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo sed -i -E "s|https?://[^ ]+|$MIRROR|" /etc/apt/sources.list 2>/dev/null || true

          timeout 240 sudo -E apt-get "${APT_OPTS[@]}" update || echo "apt update failed; falling back to cached lists"
          timeout 600 sudo -E apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Read version
        shell: bash
        working-directory: app
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        shell: bash
        run: |
          CERT="$RUNNER_TEMP/shabdiz.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

      - name: Build macOS
        if: runner.os == 'macOS'
        working-directory: app
        run: flutter build macos --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Sign macOS app
        if: runner.os == 'macOS'
        shell: bash
        working-directory: app
        run: |
          APP="build/macos/Build/Products/Release/ShabDiz.app"
          if [ "$HAS_MACOS_CERT" = "true" ]; then
            IDENTITY="$(security find-identity -v -p codesigning | head -1 | sed -E 's/.*"(.*)"/\1/')"
            echo "Signing as: $IDENTITY"
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          else
            echo "No certificate configured — applying an ad-hoc signature."
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        working-directory: app
        run: |
          APP="build/macos/Build/Products/Release/ShabDiz.app"
          mkdir -p dist
          ZIP="dist/ShabDiz-${APP_VERSION}-macos-${ARCH}.zip"
          DMG="dist/ShabDiz-${APP_VERSION}-macos-${ARCH}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          hdiutil create -volname "ShabDiz" -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: Notarize macOS disk image
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true' && env.HAS_NOTARY == 'true'
        shell: bash
        working-directory: app
        run: |
          DMG="dist/ShabDiz-${APP_VERSION}-macos-${ARCH}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Build Linux
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          flutter build linux --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        working-directory: app
        run: |
          BUNDLE="build/linux/${ARCH}/release/bundle"
          mkdir -p dist
          TARBALL="dist/ShabDiz-${APP_VERSION}-linux-${ARCH}.tar.gz"
          tar -C "$BUNDLE" -czf "$TARBALL" .

          DEB_ARCH="amd64"
          if [ "$ARCH" = "arm64" ]; then DEB_ARCH="arm64"; fi
          PKG="build/deb"
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/shabdiz" "$PKG/usr/share/applications"
          cp -a "$BUNDLE/." "$PKG/opt/shabdiz/"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: shabdiz
          Version: ${APP_VERSION}
          Section: video
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: Pedram Gholizadeh <pedram@webiro.ir>
          Homepage: https://webiro.ir
          Depends: libmpv2 | libmpv1, libgtk-3-0 | libgtk-3-0t64, libsecret-1-0
          Description: ShabDiz — synchronized open-source cinema nights
           Watch scheduled films together, in sync, with mpv-powered playback
           and Persian subtitles.
          EOF
          cat > "$PKG/usr/share/applications/shabdiz.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ShabDiz
          Name[fa]=شب‌دیز
          Comment=Synchronized cinema nights
          Exec=/opt/shabdiz/shabdiz
          Terminal=false
          Categories=AudioVideo;Video;
          StartupWMClass=ir.webiro.shabdiz
          EOF
          dpkg-deb --build --root-owner-group "$PKG" "dist/ShabDiz-${APP_VERSION}-linux-${ARCH}.deb"

      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: app
        run: flutter build windows --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "shabdiz.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $pfx /p $env:WINDOWS_PFX_PASSWORD "build\windows\x64\runner\Release\shabdiz.exe"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: app
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/ShabDiz-$env:APP_VERSION-windows-x64.zip"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish desktop release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "${{ github.repository }}" --title "ShabDiz $TAG" --generate-notes
          gh release upload "$TAG" dist/* -R "${{ github.repository }}" --clobber
